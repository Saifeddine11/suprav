name: Deploy React to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || (echo "FTP_SERVER secret is missing" && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME secret is missing" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD secret is missing" && exit 1)

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html is missing" && exit 1)
          test -f dist/.htaccess || (echo "dist/.htaccess is missing" && exit 1)

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./
          timeout: 60000
          log-level: verbose
          dangerous-clean-slate: true
