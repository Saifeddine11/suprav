name: Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build SPA
        run: npm run build:spa

      - name: Prerender routes
        run: npm run prerender 2>&1 | tee prerender.log

      - name: Show prerender log on failure
        if: failure()
        run: tail -80 prerender.log || true

      - name: Verify prerender output
        run: |
          set -euo pipefail
          for route in services realisations realisations/websites realisations/production-videos contact mentions-legales blog; do
            test -f "dist/${route}/index.html"
          done
          grep -q 'Blog' dist/blog/index.html
          grep -q 'Les prochains articles arrivent' dist/blog/index.html
          grep -q 'Nos services' dist/services/index.html
          grep -q 'Réalisations' dist/realisations/index.html
          grep -q 'Sites web' dist/realisations/websites/index.html
          grep -q 'Production vidéos' dist/realisations/production-videos/index.html
          grep -q 'Contact' dist/contact/index.html
          ! grep -q '15 000 MAD' dist/index.html
          ! grep -q '15 000 MAD' dist/realisations/index.html

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html || (echo "::error::dist/index.html is missing" && exit 1)
          test -f dist/.htaccess || (echo "::error::dist/.htaccess is missing" && exit 1)
          test -f dist/api/contact.php || (echo "::error::dist/api/contact.php is missing" && exit 1)

      - name: Check SFTP secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail

          test -n "$SFTP_HOST" || (echo "::error::SFTP_HOST secret is missing" && exit 1)
          test -n "$SFTP_USERNAME" || (echo "::error::SFTP_USERNAME secret is missing" && exit 1)
          test -n "$SFTP_PASSWORD" || (echo "::error::SFTP_PASSWORD secret is missing" && exit 1)
          test -n "$SFTP_PORT" || (echo "::error::SFTP_PORT secret is missing. Use 22 for SFTP." && exit 1)

          if ! [[ "$SFTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::SFTP_PORT must be a number. Use 22 for SFTP."
            exit 1
          fi

          echo "SFTP host: $SFTP_HOST"
          echo "SFTP port: $SFTP_PORT"

      - name: Install lftp
        run: brew install lftp

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          ATTEMPTS=3
          REMOTE_PATH="${SFTP_REMOTE_PATH:-public_html}"

          echo "Deploying the contents of dist/ to ${REMOTE_PATH} on ${SFTP_HOST}:${SFTP_PORT}"
          echo "Remote config file api/contact-config.php will be preserved."

          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "SFTP deployment attempt ${attempt}/${ATTEMPTS}"

            COMMAND_FILE="$(mktemp)"
            {
              echo "set cmd:fail-exit yes"
              echo "set sftp:auto-confirm yes"
              echo "set net:timeout 45"
              echo "set net:max-retries 3"
              echo "set net:reconnect-interval-base 5"
              echo "set net:reconnect-interval-max 30"
              echo "lcd dist"
              echo "cd \"${REMOTE_PATH}\""

              find dist -type d -mindepth 1 | sort | while IFS= read -r directory; do
                remote_directory="${directory#dist/}"
                printf 'mkdir -p "./%s"\n' "$remote_directory"
              done

              find dist -type f | sort | while IFS= read -r file; do
                remote_file="${file#dist/}"
                if [ "$remote_file" = "api/contact-config.php" ]; then
                  continue
                fi

                remote_directory="$(dirname "$remote_file")"
                if [ "$remote_directory" = "." ]; then
                  printf 'put "%s"\n' "$remote_file"
                else
                  printf 'put -O "./%s" "%s"\n' "$remote_directory" "$remote_file"
                fi
              done

              echo "bye"
            } > "$COMMAND_FILE"

            if lftp -u "${SFTP_USERNAME},${SFTP_PASSWORD}" "sftp://${SFTP_HOST}:${SFTP_PORT}" < "$COMMAND_FILE"
            then
              rm -f "$COMMAND_FILE"
              echo "Deployment completed successfully."
              exit 0
            fi

            rm -f "$COMMAND_FILE"

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              sleep_seconds=$((attempt * 20))
              echo "::warning::SFTP deployment failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "::error::SFTP deployment failed after ${ATTEMPTS} attempts. Check SFTP_HOST, SFTP_PORT, SFTP_USERNAME, SFTP_PASSWORD, SFTP_REMOTE_PATH and Hostinger SFTP access."
          exit 1
