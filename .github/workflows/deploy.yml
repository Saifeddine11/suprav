name: Deploy to Hostinger via FTP

# main : construit, vérifie et envoie sur Hostinger.
# refonte-accueil-v3 : construit et vérifie seulement (aucun envoi), pour tester avant de fusionner.
on:
  push:
    branches:
      - main
      - refonte-accueil-v3
  workflow_dispatch:

concurrency:
  group: hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # Le pré-rendu utilise le Chrome déjà installé sur le runner
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Build SPA
        run: npm run build:spa

      - name: Prerender routes
        shell: bash
        run: |
          # pipefail : sans lui, un échec du pré-rendu était masqué par « tee »
          set -o pipefail
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "Chrome : ${PUPPETEER_EXECUTABLE_PATH:-celui de puppeteer}"
          npm run prerender 2>&1 | tee prerender.log

      - name: Show prerender log on failure
        if: failure()
        run: |
          tail -80 prerender.log || true
          # Les dernières lignes en annotations : lisibles depuis le résumé de l'exécution
          tail -8 prerender.log 2>/dev/null | sed 's/^/::error::/' || true

      - name: Verify prerender output
        run: |
          set -euo pipefail
          check() { test -f "dist/$1/index.html" || { echo "::error::dist/$1/index.html manquant"; exit 1; }; grep -q '<h1' "dist/$1/index.html" || { echo "::error::pas de H1 dans dist/$1"; exit 1; }; }
          for route in services realisations realisations/websites realisations/production-videos agence contact rejoindre blog mentions-legales; do
            check "$route"
          done
          for article in src/data/blog/*.js; do
            slug="$(basename "$article" .js)"
            case "$slug" in _*) continue ;; esac
            check "blog/$slug"
          done
          grep -q 'rel="canonical" href="https://www.suprav3.com/agence"' dist/agence/index.html
          grep -q 'Réalisations' dist/realisations/index.html
          grep -q 'Rejoignez' dist/rejoindre/index.html
          ! grep -q '15 000 MAD' dist/index.html
          ! grep -q '15 000 MAD' dist/realisations/index.html

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html || (echo "::error::dist/index.html is missing" && exit 1)
          test -f dist/.htaccess || (echo "::error::dist/.htaccess is missing" && exit 1)
          test -f dist/api/contact.php || (echo "::error::dist/api/contact.php is missing" && exit 1)
          test -f dist/api/candidature.php || (echo "::error::dist/api/candidature.php is missing" && exit 1)

      - name: Check FTP secrets
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail

          test -n "$FTP_HOST" || (echo "::error::Secret FTP_HOST manquant" && exit 1)
          test -n "$FTP_USERNAME" || (echo "::error::Secret FTP_USERNAME manquant" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "::error::Secret FTP_PASSWORD manquant" && exit 1)
          test -n "$FTP_PORT" || (echo "::error::Secret FTP_PORT manquant (21 pour FTP, 65002 pour SFTP chez Hostinger)" && exit 1)

          if ! [[ "$FTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::FTP_PORT doit être un nombre (21 pour FTP, 65002 pour SFTP chez Hostinger)."
            exit 1
          fi

          echo "Hôte : $FTP_HOST"
          echo "Port : $FTP_PORT"

      - name: Install lftp
        if: github.ref == 'refs/heads/main'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via FTP / SFTP
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          ATTEMPTS=3
          REMOTE_PATH="${FTP_REMOTE_PATH:-public_html}"
          # Port 21 : FTP (chiffré en TLS quand le serveur le propose) ; tout autre port : SFTP
          if [ "$FTP_PORT" = "21" ]; then PROTO="ftp"; else PROTO="sftp"; fi

          echo "Deploying the contents of dist/ to ${REMOTE_PATH} on ${PROTO}://${FTP_HOST}:${FTP_PORT}"
          echo "Remote config file api/contact-config.php will be preserved."

          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Deployment attempt ${attempt}/${ATTEMPTS} (${PROTO})"

            COMMAND_FILE="$(mktemp)"
            {
              echo "set cmd:fail-exit yes"
              echo "set sftp:auto-confirm yes"
              echo "set ftp:ssl-allow yes"
              echo "set ftp:passive-mode yes"
              echo "set ssl:verify-certificate no"
              echo "set net:timeout 45"
              echo "set net:max-retries 3"
              echo "set net:reconnect-interval-base 5"
              echo "set net:reconnect-interval-max 30"
              echo "lcd dist"
              echo "cd \"${REMOTE_PATH}\""

              find dist -mindepth 1 -type d | sort | while IFS= read -r directory; do
                remote_directory="${directory#dist/}"
                printf 'mkdir -p "./%s"\n' "$remote_directory"
              done

              find dist -type f | sort | while IFS= read -r file; do
                remote_file="${file#dist/}"
                if [ "$remote_file" = "api/contact-config.php" ]; then
                  continue
                fi

                remote_directory="$(dirname "$remote_file")"
                if [ "$remote_directory" = "." ]; then
                  printf 'put "%s"\n' "$remote_file"
                else
                  printf 'put -O "./%s" "%s"\n' "$remote_directory" "$remote_file"
                fi
              done

              echo "bye"
            } > "$COMMAND_FILE"

            if lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" "${PROTO}://${FTP_HOST}:${FTP_PORT}" < "$COMMAND_FILE"
            then
              rm -f "$COMMAND_FILE"
              echo "Deployment completed successfully."
              exit 0
            fi

            rm -f "$COMMAND_FILE"

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              sleep_seconds=$((attempt * 20))
              echo "::warning::Deployment failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "::error::Envoi impossible après ${ATTEMPTS} essais (${PROTO}). Vérifiez FTP_HOST, FTP_PORT, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_PATH et l'accès FTP/SSH dans hPanel."
          exit 1
